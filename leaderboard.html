<style>
  :root{
    --bg:#F2EEE1; --surface:#FFFFFF; --ink:#2B2620; --ink-soft:#655D4F;
    --mustard:#C79A2E; --mustard-soft:#F3E6C4; --teal:#355F58; --teal-soft:#DCE7E3;
    --success:#5E7A3D; --success-soft:#E1E9D3;
    --aqua:#3E9C8E; --aqua-soft:#DCEFEC; --orange:#DD8A3D; --orange-soft:#FBE7D2;
    --line:#DED2B4; --shadow:0 2px 0 rgba(43,38,32,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:#F7F5F0; color:var(--ink); font-family:'Karla',sans-serif;}
  .wrap{max-width:520px; margin:0 auto; padding:28px 20px 90px; text-align:center;}
  h1{font-family:'Fraunces',serif; font-size:30px; margin:0 0 4px;}
  .sub{color:var(--ink-soft); font-size:14.5px; margin:0 0 30px;}

  .podio{display:flex; align-items:flex-end; justify-content:center; gap:10px; margin-bottom:36px;}
  .podio-spot{display:flex; flex-direction:column; align-items:center; width:100px;}
  .podio-avatar{width:56px; height:56px; border-radius:50%; background:var(--surface); border:1px solid #D9D3C4; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:22px; margin-bottom:8px; overflow:hidden;}
  .podio-avatar img{width:100%; height:100%; object-fit:cover; image-rendering:pixelated;}
  .btn{font-family:'Karla',sans-serif; font-weight:700; font-size:13.5px; padding:8px 16px; border-radius:100px; border:none; cursor:pointer; background:var(--ink); color:#fff;}
  .btn.secondary{background:transparent; color:var(--ink); border:1.5px solid var(--ink);}
  .podio-nombre{font-weight:700; font-size:13.5px; margin-bottom:2px; max-width:95px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .podio-score{font-size:11.5px; color:var(--ink-soft); margin-bottom:8px;}
  .podio-bloque{width:100%; border-radius:4px 4px 0 0; display:flex; align-items:flex-start; justify-content:center; padding-top:6px; font-family:'Fraunces',serif; font-weight:600; font-size:18px; color:#fff;}
  .p1 .podio-bloque{height:100px; background:var(--ink);}
  .p1 .podio-avatar{border:2px solid var(--mustard); width:68px; height:68px;}
  .p2 .podio-bloque{height:72px; background:#6F675A;}
  .p3 .podio-bloque{height:52px; background:#A8A08F;}

  .lista{background:var(--surface); border:1px solid #E4DFD3; border-radius:8px; padding:6px 18px; text-align:left;}
  .fila{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line);}
  .fila:last-child{border-bottom:none;}
  .fila .pos{width:22px; font-weight:700; color:var(--ink-soft); font-size:13.5px;}
  .fila .nombre{flex:1; font-size:14.5px;}
  .fila .nombre small{display:block; color:var(--ink-soft); font-size:11.5px;}
  .fila .stat{font-size:13px; color:var(--ink-soft); text-align:right;}
  .empty{color:var(--ink-soft); font-size:14px; padding:30px 0;}

  /* Avatares: cuerpo pixelado + cabeza, sin círculo ni fondo */
  svg.av{height:100%; width:auto; display:block; overflow:visible;}
  .podio-avatar:has(svg.av){border-radius:0 !important; background:transparent !important; border:none !important; overflow:visible !important; width:auto !important; height:70px !important;}
  .p1 .podio-avatar:has(svg.av){height:84px !important;}
</style>

  <p class="sub">Histórico de todos los recorridos — toma de seco 10 pts · suplemento 15 · piedras 20</p>

  <div class="podio" id="podio"></div>
  <div class="lista" id="lista"><div class="empty">Cargando...</div></div>
</div>

<script>
async function cargarRanking(){
  try{
    const personas = await calcularRanking();
    renderPodio(personas.slice(0,3));
    renderLista(personas);
  }catch(e){
    console.error(e);
    document.getElementById("lista").innerHTML = "<div class='empty'>No se pudo cargar el ranking.</div>";
  }
}

function avatarHtml(p){
  return avatarSVG({ nombre: p.nombre, avatar: p.avatar });
}

function renderPodio(top3){
  const el = document.getElementById("podio");
  el.innerHTML = "";
  const claseByIdx = {0:"p1", 1:"p2", 2:"p3"};
  [1,0,2].forEach(idx => {
    const p = top3[idx];
    if(!p) return;
    const spot = document.createElement("div");
    spot.className = "podio-spot " + claseByIdx[idx];
    spot.innerHTML = `
      <div class="podio-avatar">${avatarHtml(p)}</div>
      <div class="podio-nombre">${escapeHtml(p.nombre)}</div>
      <div class="podio-score">${p.puntos} pts</div>
      <div class="podio-bloque">${idx+1}</div>
    `;
    el.appendChild(spot);
  });
  if(top3.length === 0) el.innerHTML = "<div class='empty'>Todavía nadie completó tareas.</div>";
}

function renderLista(personas){
  const el = document.getElementById("lista");
  if(personas.length === 0){ el.innerHTML = "<div class='empty'>Todavía nadie completó tareas.</div>"; return; }
  el.innerHTML = "";
  personas.forEach((p, i) => {
    const fila = document.createElement("div");
    fila.className = "fila";
    fila.innerHTML = `
      <div class="pos">#${i+1}</div>
      <div class="nombre">${escapeHtml(p.nombre)}<small>${escapeHtml(p.recorridos.join(", "))}</small></div>
      <div class="stat">${p.puntos} pts</div>
    `;
    el.appendChild(fila);
  });
}

cargarRanking();
</script>
