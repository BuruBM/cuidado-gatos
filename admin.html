<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F2EEE1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Les Gates">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Admin — Cuidado de Milo y Zoe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="comun.js"></script>
<style>
  :root{
    --bg:#F2EEE1; --surface:#FFFFFF; --ink:#2B2620; --ink-soft:#655D4F;
    --mustard:#C79A2E; --mustard-soft:#F3E6C4; --teal:#355F58; --teal-soft:#DCE7E3;
    --clay:#A65136; --clay-soft:#F0DCD2; --success:#5E7A3D; --success-soft:#E1E9D3;
    --aqua:#3E9C8E; --aqua-soft:#DCEFEC; --orange:#DD8A3D; --orange-soft:#FBE7D2;
    --line:#DED2B4; --shadow:0 2px 0 rgba(43,38,32,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Karla',sans-serif;}
  .wrap{max-width:720px; margin:0 auto; padding:28px 20px 90px;}
  h1{font-family:'Fraunces',serif; font-size:30px; margin:0 0 6px;}
  .sub{color:var(--ink-soft); font-size:15px; margin:0 0 24px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px; margin-bottom:20px; box-shadow:var(--shadow);}
  .card h2{font-family:'Fraunces',serif; font-size:20px; margin:0 0 14px;}
  label{display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin:14px 0 5px;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=number], input[type=date], textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line);
    font-family:'Karla',sans-serif; font-size:14.5px; box-sizing:border-box;
  }
  textarea{resize:vertical; min-height:60px;}
  .btn{font-family:'Karla',sans-serif; font-weight:700; font-size:14px; padding:10px 18px; border-radius:100px; border:none; cursor:pointer; background:var(--ink); color:#fff;}
  .btn.secondary{background:transparent; color:var(--ink); border:1.5px solid var(--ink);}
  .btn.small{font-size:12.5px; padding:6px 12px;}
  .btn:disabled{opacity:0.4; cursor:default;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .row > div{min-width:130px;}
  .recorrido-item, .card{overflow-wrap:anywhere;}
  .persona-row{flex-wrap:wrap;}
  .add-persona input[type=file]{max-width:100%;}
  .row > div{flex:1;}
  .avatar-preview{display:flex; align-items:center; gap:14px; margin-top:10px;}
  .avatar-preview img{width:64px; height:64px; border-radius:50%; background:var(--bg); border:2px solid var(--line); image-rendering:pixelated;}
  canvas{display:none;}
  .recorrido-item{border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; background:#FBF9F3;}
  .recorrido-item h3{margin:0 0 4px; font-family:'Fraunces',serif; font-size:17px;}
  .recorrido-item .meta{font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;}
  .recorrido-item .link-box{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:10px;}
  .recorrido-item .link-box input{flex:1 1 100%; min-width:0;}
  .recorrido-item .link-box input{font-size:12px; padding:6px 8px;}
  .tag-activo{display:inline-block; background:var(--success-soft); color:#3E5324; font-size:11px; font-weight:700; padding:2px 8px; border-radius:100px;}
  .tag-archivado{display:inline-block; background:var(--line); color:var(--ink-soft); font-size:11px; font-weight:700; padding:2px 8px; border-radius:100px;}
  .participante-row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .participante-row:last-child{border-bottom:none;}
  .participante-row .bar{background:var(--line); border-radius:6px; height:6px; width:80px; overflow:hidden; margin-top:3px;}
  .participante-row .bar-fill{background:var(--success); height:100%;}
  .msg-dest{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 8px;}
  .dest-chip{display:inline-flex; align-items:center; gap:5px; margin:0; font-size:13px; font-weight:600; color:var(--ink); background:#fff; border:1.5px solid var(--line); border-radius:100px; padding:4px 10px; cursor:pointer;}
  .persona-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .persona-row:last-child{border-bottom:none;}
  .persona-row img, .persona-row .sin-foto{width:36px; height:36px; border-radius:50%; flex:none; background:var(--bg); border:1px solid var(--line); image-rendering:pixelated; object-fit:cover;}
  .persona-row .sin-foto{display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--ink-soft);}
  .persona-row .info{flex:1; min-width:0;}
  .persona-row .info small{display:block; color:var(--ink-soft); font-size:12px;}
  .persona-row .acciones{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .personas-box{margin-top:12px; border-top:1px solid var(--line); padding-top:10px;}
  .personas-box h4{margin:0 0 4px; font-size:13px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft);}
  .add-persona{display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap;}
  .add-persona input[type=text]{flex:1; min-width:140px;}
  .add-persona input[type=file]{font-size:12px; max-width:200px;}
  .vinculado{color:var(--success); font-weight:700;}
  #gate{max-width:360px; margin:80px auto; text-align:center;}
  #panelWrap{display:none;}
  .btn-google{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; background:#fff; color:var(--ink); border:1.5px solid var(--line); margin-top:10px;}
  .btn-google svg{width:18px; height:18px;}
  .session{font-size:12.5px; color:var(--ink-soft); margin-bottom:18px;}
  .session button{background:none; border:none; padding:0; font:inherit; color:var(--ink-soft); text-decoration:underline; cursor:pointer;}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:100px; font-size:13.5px; opacity:0; transition:opacity .3s ease; pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="wrap">
  <div id="gate" class="card">
    <h2>Panel Admin 🔒</h2>
    <p style="font-size:14px; color:var(--ink-soft); margin:0;" id="gateMsg">Entrá con tu cuenta de Google de admin.</p>
    <button class="btn btn-google" id="loginBtn"><svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Entrar con Google</button>
    <a href="index.html" style="display:inline-block; margin-top:16px; font-size:13px; color:var(--ink-soft);">← Volver al inicio</a>
  </div>

  <div id="panelWrap">
    <h1>Panel Admin</h1>
    <p class="sub">Michis en Casa — gestión de recorridos</p>
    <div class="session" id="session"></div>

    <div class="card">
      <h2>Crear nuevo recorrido</h2>
      <label>Nombre del recorrido</label>
      <input type="text" id="fNombre" placeholder="Ej: Cuidado de Milo y Zoe — Octubre">
      <div class="row">
        <div>
          <label>Cantidad de días</label>
          <input type="number" id="fDias" value="3" min="1" max="14">
        </div>
        <div>
          <label>Fecha de inicio</label>
          <input type="date" id="fFecha">
        </div>
      </div>
      <label>Personas que cuidan (el nombre acepta apodos: "pam" sirve para Pame y Pamela)</label>
      <div id="fPersonas"></div>
      <button class="btn small secondary" id="fAgregarPersona" style="margin-top:8px;">+ Agregar persona</button>
      <label>Mensaje pop-up de bienvenida (opcional, lo ve cada persona una vez al entrar)</label>
      <textarea id="fPopup" placeholder="Ej: ¡Gracias por bancarnos estos días! Cualquier cosa nos escribís."></textarea>
      <button class="btn" style="margin-top:16px;" id="crearBtn">Crear recorrido</button>
      <div id="crearMsg" style="font-size:13.5px; margin-top:10px; color:var(--success); word-break:break-all;"></div>
    </div>

    <div class="card">
      <h2>Recorridos existentes</h2>
      <div id="recorridosList">Cargando...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let usuario = null;

auth.getRedirectResult().catch(e => console.error(e));
document.getElementById("loginBtn").addEventListener("click", loginGoogle);

auth.onAuthStateChanged(user => {
  usuario = user;
  const gateMsg = document.getElementById("gateMsg");
  if(!user){
    document.getElementById("gate").style.display = "block";
    document.getElementById("panelWrap").style.display = "none";
    gateMsg.textContent = "Entrá con tu cuenta de Google de admin.";
    return;
  }
  if(!esAdmin(user)){
    document.getElementById("gate").style.display = "block";
    document.getElementById("panelWrap").style.display = "none";
    gateMsg.innerHTML = `La cuenta ${escapeHtml(user.email)} no es admin. <button class="btn small secondary" id="otraCuenta" style="margin-top:8px;">Usar otra cuenta</button>`;
    document.getElementById("otraCuenta").addEventListener("click", () => auth.signOut());
    document.getElementById("loginBtn").style.display = "none";
    return;
  }
  document.getElementById("gate").style.display = "none";
  document.getElementById("panelWrap").style.display = "block";
  document.getElementById("session").innerHTML = `Conectada como ${escapeHtml(user.email)} · <button id="logoutBtn">Salir</button>`;
  document.getElementById("logoutBtn").addEventListener("click", () => auth.signOut().then(() => location.reload()));
  document.getElementById("fFecha").value = new Date().toISOString().slice(0,10);
  if(!document.querySelector("#fPersonas .persona-form")) agregarFilaPersona();
  cargarRecorridos();
});

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

// ===== Pixelado de foto en el navegador (canvas) =====
function pixelateFileToDataUrl(file, onDone){
  const img = new Image();
  img.onload = () => {
    const side = Math.min(img.width, img.height);
    const sx = (img.width - side)/2, sy = (img.height - side)/2;
    const small = document.createElement("canvas");
    small.width = 22; small.height = 22;
    const sctx = small.getContext("2d");
    sctx.imageSmoothingEnabled = true;
    sctx.drawImage(img, sx, sy, side, side, 0, 0, 22, 22);

    const canvas = document.createElement("canvas");
    canvas.width = 240; canvas.height = 240;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(small, 0, 0, 22, 22, 0, 0, 240, 240);
    ctx.globalCompositeOperation = "destination-in";
    ctx.beginPath();
    ctx.arc(120,120,120,0,Math.PI*2);
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    onDone(canvas.toDataURL("image/png"));
  };
  img.src = URL.createObjectURL(file);
}
function bindFoto(input, preview){
  input.addEventListener("change", e => {
    const file = e.target.files[0];
    if(!file) return;
    pixelateFileToDataUrl(file, dataUrl => {
      input.dataset.avatar = dataUrl;
      if(preview){ preview.src = dataUrl; preview.style.display = ""; }
    });
  });
}

// ===== Personas en el formulario de creación =====
function agregarFilaPersona(){
  const row = document.createElement("div");
  row.className = "add-persona persona-form";
  row.innerHTML = `
    <input type="text" placeholder="Nombre o apodo" class="p-nombre">
    <input type="file" accept="image/*" class="p-foto">
    <img class="p-preview" style="display:none; width:36px; height:36px; border-radius:50%; image-rendering:pixelated;">
    <button class="btn small secondary p-quitar">Quitar</button>`;
  bindFoto(row.querySelector(".p-foto"), row.querySelector(".p-preview"));
  row.querySelector(".p-quitar").addEventListener("click", () => row.remove());
  document.getElementById("fPersonas").appendChild(row);
}
document.getElementById("fAgregarPersona").addEventListener("click", agregarFilaPersona);

// El id de cada participante sale del nombre, sin repetir dentro del recorrido
async function crearParticipante(recorridoId, recorridoNombre, nombre, avatar){
  const col = db.collection("recorridos").doc(recorridoId).collection("participantes");
  const base = slugify(nombre);
  let id = base, n = 2;
  while((await col.doc(id).get()).exists) id = base + "-" + (n++);
  await col.doc(id).set({ nombre, avatar: avatar || "", recorridoNombre, uid: null, migrado: true, creado: Date.now() });
}

// ===== Crear recorrido =====
document.getElementById("crearBtn").addEventListener("click", async () => {
  const nombre = document.getElementById("fNombre").value.trim();
  const dias = parseInt(document.getElementById("fDias").value) || 3;
  const fechaInicio = document.getElementById("fFecha").value;
  const popupGlobal = document.getElementById("fPopup").value.trim();
  const personas = Array.from(document.querySelectorAll("#fPersonas .persona-form"))
    .map(row => ({ nombre: row.querySelector(".p-nombre").value.trim(), avatar: row.querySelector(".p-foto").dataset.avatar || "" }))
    .filter(p => p.nombre);

  if(!nombre){ toast("Ponele un nombre al recorrido"); return; }
  if(!fechaInicio){ toast("Elegí la fecha de inicio"); return; }
  if(personas.length === 0){ toast("Agregá al menos una persona"); return; }

  const btn = document.getElementById("crearBtn");
  btn.disabled = true; btn.textContent = "Creando...";
  try{
    const docRef = await db.collection("recorridos").add({
      nombre, dias, fechaInicio,
      popupGlobal: popupGlobal || "",
      activo: true,
      creado: Date.now()
    });
    for(const p of personas) await crearParticipante(docRef.id, nombre, p.nombre, p.avatar);
    const url = linkDe(docRef.id);
    document.getElementById("crearMsg").innerHTML = `Recorrido creado. Link: <a href="${url}" target="_blank">${url}</a>`;
    document.getElementById("fNombre").value = "";
    document.getElementById("fPopup").value = "";
    document.getElementById("fPersonas").innerHTML = "";
    agregarFilaPersona();
    cargarRecorridos();
  }catch(e){
    console.error(e);
    toast("Error al crear. Revisá la consola.");
  }
  btn.disabled = false; btn.textContent = "Crear recorrido";
});

function etiquetaEstado(r){
  if(!r.activo) return '<span class="tag-archivado">archivado</span>';
  if(r.fechaInicio && diaDelRecorrido(r) > (r.dias || 3)) return '<span class="tag-archivado">terminado</span>';
  return '<span class="tag-activo">activo</span>';
}

function linkDe(id){
  return `${location.origin}${location.pathname.replace("admin.html","index.html")}?r=${id}`;
}

// ===== Listado + monitoreo en vivo =====
const listeners = [];
async function cargarRecorridos(){
  listeners.splice(0).forEach(unsub => unsub());
  const listEl = document.getElementById("recorridosList");
  try{
    const snap = await db.collection("recorridos").orderBy("creado","desc").get();
    if(snap.empty){ listEl.innerHTML = "<p style='color:var(--ink-soft); font-size:14px;'>Todavía no creaste ningún recorrido.</p>"; return; }
    listEl.innerHTML = "";
    snap.forEach(doc => {
      const r = doc.data();
      const id = doc.id;
      const url = linkDe(id);
      const item = document.createElement("div");
      item.className = "recorrido-item";
      item.innerHTML = `
        <h3>${escapeHtml(r.nombre || "(sin nombre)")} ${etiquetaEstado(r)}</h3>
        <div class="meta">${r.dias} días · desde ${escapeHtml(r.fechaInicio || "?")}</div>
        <div class="link-box">
          <input type="text" readonly value="${url}">
          <button class="btn small secondary" data-accion="copiar">Copiar</button>
          <button class="btn small secondary" data-accion="archivar">${r.activo ? 'Archivar' : 'Reactivar'}</button>
          <button class="btn small secondary" data-accion="editar">Editar</button>
          <button class="btn small secondary" data-accion="eliminar" style="color:#A65136; border-color:#A65136;">Eliminar</button>
        </div>
        <div class="edit-box" style="display:none; border-top:1px solid var(--line); margin-top:6px; padding-top:12px;">
          <label>Nombre del recorrido</label>
          <input type="text" class="e-nombre" value="${escapeHtml(r.nombre||'')}">
          <div class="row">
            <div>
              <label>Cantidad de días</label>
              <input type="number" class="e-dias" value="${r.dias||3}" min="1" max="14">
            </div>
            <div>
              <label>Fecha de inicio</label>
              <input type="date" class="e-fecha" value="${escapeHtml(r.fechaInicio||'')}">
            </div>
          </div>
          <label>Mensaje pop-up de bienvenida</label>
          <textarea class="e-popup">${escapeHtml(r.popupGlobal||'')}</textarea>
          <button class="btn small" style="margin-top:10px;" data-accion="guardar">Guardar cambios</button>
        </div>
        <div class="personas-box">
          <h4>Personas</h4>
          <div class="personas-list">Cargando...</div>
          <div class="add-persona">
            <input type="text" placeholder="Agregar persona (nombre o apodo)" class="a-nombre">
            <input type="file" accept="image/*" class="a-foto">
            <button class="btn small" data-accion="agregar">Agregar</button>
          </div>
        </div>
        <div class="personas-box">
          <h4>Mensaje pop-up</h4>
          <div class="msg-dest"></div>
          <textarea class="msg-txt" placeholder="Ej: ¡No se olviden de las piedras hoy!"></textarea>
          <button class="btn small" data-accion="mensaje" style="margin-top:8px;">Enviar</button>
        </div>
      `;
      listEl.appendChild(item);
      bindFoto(item.querySelector(".a-foto"), null);
      item.querySelectorAll("[data-accion]").forEach(b => b.addEventListener("click", () => accionRecorrido(b.dataset.accion, id, r, item)));
      escucharRecorrido(id, r, item);
    });
  }catch(e){
    console.error(e);
    listEl.innerHTML = "<p style='color:#A65136;'>Error cargando recorridos.</p>";
  }
}

async function accionRecorrido(accion, id, r, item){
  const ref = db.collection("recorridos").doc(id);
  try{
    if(accion === "copiar"){ navigator.clipboard.writeText(linkDe(id)); toast("Link copiado"); }
    if(accion === "archivar"){
      await ref.update({ activo: !r.activo });
      toast(r.activo ? "Recorrido archivado" : "Recorrido reactivado");
      cargarRecorridos();
    }
    if(accion === "editar"){
      const box = item.querySelector(".edit-box");
      box.style.display = box.style.display === "none" ? "block" : "none";
    }
    if(accion === "guardar"){
      await ref.update({
        nombre: item.querySelector(".e-nombre").value.trim(),
        dias: parseInt(item.querySelector(".e-dias").value) || 3,
        fechaInicio: item.querySelector(".e-fecha").value,
        popupGlobal: item.querySelector(".e-popup").value.trim()
      });
      toast("Cambios guardados");
      cargarRecorridos();
    }
    if(accion === "eliminar") await eliminarRecorrido(id, r.nombre || "");
    if(accion === "agregar"){
      const input = item.querySelector(".a-nombre");
      const foto = item.querySelector(".a-foto");
      const nombre = input.value.trim();
      if(!nombre){ toast("Escribí un nombre"); return; }
      await crearParticipante(id, r.nombre || "", nombre, foto.dataset.avatar || "");
      input.value = ""; foto.value = ""; delete foto.dataset.avatar;
      toast(`${nombre} agregado`);
    }
    if(accion === "mensaje"){
      const pids = Array.from(item.querySelectorAll(".msg-dest input[data-pid]:checked")).map(c => c.dataset.pid);
      const mensaje = item.querySelector(".msg-txt").value.trim();
      if(pids.length === 0 || !mensaje){ toast("Elegí a quién y escribí el mensaje"); return; }
      const batch = db.batch();
      pids.forEach(pid => batch.update(ref.collection("participantes").doc(pid), { popupPersonal: { mensaje, leido: false, enviado: Date.now() } }));
      await batch.commit();
      item.querySelector(".msg-txt").value = "";
      item.querySelectorAll(".msg-dest input").forEach(c => c.checked = false);
      toast(`Mensaje enviado a ${pids.length === 1 ? "1 persona" : pids.length + " personas"} — le aparece al abrir la app (o al instante si la tiene abierta)`);
    }
  }catch(e){
    console.error(e);
    toast("Error. Revisá la consola.");
  }
}

function escucharRecorrido(recorridoId, r, item){
  const ref = db.collection("recorridos").doc(recorridoId);
  let participantes = {}, tareas = {};
  const render = () => renderPersonas(recorridoId, r, item, participantes, tareas);
  listeners.push(ref.collection("participantes").onSnapshot(snap => {
    participantes = {};
    snap.forEach(doc => participantes[doc.id] = doc.data());
    Object.keys(participantes).forEach(pid => {
      if(participantes[pid].state && !participantes[pid].migrado) migrarProgresoViejo(recorridoId, pid, participantes[pid]);
    });
    render();
  }, e => console.error(e)));
  listeners.push(ref.collection("tareas").onSnapshot(snap => {
    tareas = {};
    snap.forEach(doc => tareas[doc.id] = doc.data());
    render();
  }, e => console.error(e)));
}

function renderPersonas(recorridoId, r, item, participantes, tareas){
  const box = item.querySelector(".personas-list");
  const pids = Object.keys(participantes).sort((a,b) => (participantes[a].nombre||"").localeCompare(participantes[b].nombre||""));
  renderDestinatarios(item, pids, participantes);
  if(pids.length === 0){ box.innerHTML = "<p style='font-size:12.5px; color:var(--ink-soft);'>Todavía no hay personas en este recorrido.</p>"; return; }
  box.innerHTML = "";
  pids.forEach(pid => {
    const p = participantes[pid];
    const puntos = Object.values(tareas).filter(t => t.pid === pid).reduce((suma, t) => suma + puntosDeTarea(t.key), 0);
    const dias = new Set(Object.values(tareas).filter(t => t.pid === pid).map(t => t.dia)).size;
    const victoria = (p.cierre && p.cierre.pct !== undefined) ? p.cierre.pct : calcularVictoria(tareas, pid, r);
    const av = avatarDe(p);
    const row = document.createElement("div");
    row.className = "persona-row";
    row.innerHTML = `
      ${av ? `<img src="${av}" alt="">` : `<div class="sin-foto">${escapeHtml((p.nombre||"?").charAt(0).toUpperCase())}</div>`}
      <div class="info">${escapeHtml(p.nombre)}
        <small>${p.uid ? '<span class="vinculado">✓ cuenta vinculada</span>' : 'sin vincular todavía'} · ${puntos} pts · ${dias} día${dias===1?"":"s"}${victoria === null ? "" : ` · ${p.cierre ? "🏁 " : ""}${victoria}% de sus días`}</small>
      </div>
      <div class="acciones">
        <label class="btn small secondary" style="margin:0; font-size:12.5px; color:var(--ink);">Foto<input type="file" accept="image/*" style="display:none;"></label>
        ${p.uid ? '<button class="btn small secondary" data-p="liberar">Liberar</button>' : ''}
        <button class="btn small secondary" data-p="quitar" style="color:#A65136; border-color:#A65136;">Quitar</button>
      </div>`;
    const pref = db.collection("recorridos").doc(recorridoId).collection("participantes").doc(pid);
    row.querySelector("input[type=file]").addEventListener("change", e => {
      const file = e.target.files[0];
      if(!file) return;
      pixelateFileToDataUrl(file, async dataUrl => {
        try{ await pref.update({ avatar: dataUrl }); toast("Foto actualizada"); }
        catch(err){ console.error(err); toast("No se pudo guardar la foto"); }
      });
    });
    const liberar = row.querySelector('[data-p="liberar"]');
    if(liberar) liberar.addEventListener("click", async () => {
      if(!confirm(`¿Desvincular la cuenta de Google de ${p.nombre}? La próxima persona que entre con ese nombre la va a poder tomar. Sus tareas tildadas se mantienen.`)) return;
      await pref.update({ uid: null });
      toast("Cuenta desvinculada");
    });
    row.querySelector('[data-p="quitar"]').addEventListener("click", async () => {
      if(!confirm(`¿Quitar a ${p.nombre} del recorrido? Se borran también sus tareas tildadas.`)) return;
      try{
        const tSnap = await db.collection("recorridos").doc(recorridoId).collection("tareas").where("pid","==",pid).get();
        await Promise.all(tSnap.docs.map(d => d.ref.delete()));
        await pref.delete();
        toast(`${p.nombre} quitado`);
      }catch(err){ console.error(err); toast("No se pudo quitar"); }
    });
    box.appendChild(row);
  });
}

// Destinatarios del pop-up: "Todos" o las personas que elijas (se mantiene lo tildado al actualizarse la lista)
function renderDestinatarios(item, pids, participantes){
  const dest = item.querySelector(".msg-dest");
  const marcados = new Set(Array.from(dest.querySelectorAll("input[data-pid]:checked")).map(c => c.dataset.pid));
  if(pids.length === 0){ dest.innerHTML = ""; return; }
  dest.innerHTML = `<label class="dest-chip"><input type="checkbox" class="msg-todos"> Todos</label>` +
    pids.map(pid => `<label class="dest-chip"><input type="checkbox" data-pid="${pid}" ${marcados.has(pid) ? "checked" : ""}> ${escapeHtml(participantes[pid].nombre)}</label>`).join("");
  const todos = dest.querySelector(".msg-todos");
  const individuales = Array.from(dest.querySelectorAll("input[data-pid]"));
  todos.checked = individuales.length > 0 && individuales.every(c => c.checked);
  todos.addEventListener("change", () => individuales.forEach(c => c.checked = todos.checked));
  individuales.forEach(c => c.addEventListener("change", () => { todos.checked = individuales.every(x => x.checked); }));
}

// Antes cada persona tenía su propio checklist (campo "state"). Lo pasamos al checklist compartido,
// firmado a su nombre. Si dos personas tildaron lo mismo, queda la primera que se migra.
const migrando = new Set();
async function migrarProgresoViejo(recorridoId, pid, p){
  if(migrando.has(recorridoId + "/" + pid)) return;
  migrando.add(recorridoId + "/" + pid);
  try{
    const ref = db.collection("recorridos").doc(recorridoId);
    const existentes = new Set((await ref.collection("tareas").get()).docs.map(d => d.id));
    const batch = db.batch();
    let migradas = 0;
    Object.keys(p.state || {}).forEach(d => {
      Object.keys(p.state[d] || {}).forEach(key => {
        const id = d + "_" + key;
        if(!p.state[d][key] || existentes.has(id)) return;
        existentes.add(id);
        migradas++;
        batch.set(ref.collection("tareas").doc(id), {
          dia: Number(d), key, pid, nombre: p.nombre || "", uid: p.uid || null,
          creado: p.actualizado || Date.now(), migrado: true
        });
      });
    });
    const update = { migrado: true };
    if(!p.avatar && avatarDe(p)) update.avatar = avatarDe(p);
    batch.update(ref.collection("participantes").doc(pid), update);
    await batch.commit();
    if(migradas) toast(`Progreso de ${p.nombre} migrado al checklist compartido`);
  }catch(e){
    console.error("No se pudo migrar", e);
    migrando.delete(recorridoId + "/" + pid);
  }
}

async function eliminarRecorrido(id, nombre){
  const confirmacion = prompt(`Esto borra "${nombre}" para siempre, junto con las personas, las tareas y los comentarios del recorrido. Escribí ELIMINAR para confirmar:`);
  if(confirmacion !== "ELIMINAR"){
    if(confirmacion !== null) toast("No coincide, no se borró nada.");
    return;
  }
  try{
    const ref = db.collection("recorridos").doc(id);
    const borrados = [];
    for(const sub of ["participantes","tareas","comentarios"]){
      const snap = await ref.collection(sub).get();
      snap.forEach(doc => borrados.push(doc.ref.delete()));
    }
    await Promise.all(borrados);
    await ref.delete();
    toast("Recorrido eliminado");
    cargarRecorridos();
  }catch(e){
    console.error(e);
    toast("Error al eliminar. Revisá la consola.");
  }
}
