<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Cuidado de Milo y Zoe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#F2EEE1; --surface:#FFFFFF; --ink:#2B2620; --ink-soft:#655D4F;
    --mustard:#C79A2E; --mustard-soft:#F3E6C4; --teal:#355F58; --teal-soft:#DCE7E3;
    --clay:#A65136; --clay-soft:#F0DCD2; --success:#5E7A3D; --success-soft:#E1E9D3;
    --aqua:#3E9C8E; --aqua-soft:#DCEFEC; --orange:#DD8A3D; --orange-soft:#FBE7D2;
    --line:#DED2B4; --shadow:0 2px 0 rgba(43,38,32,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Karla',sans-serif;}
  .wrap{max-width:720px; margin:0 auto; padding:28px 20px 90px;}
  h1{font-family:'Fraunces',serif; font-size:30px; margin:0 0 6px;}
  .sub{color:var(--ink-soft); font-size:15px; margin:0 0 24px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px; margin-bottom:20px; box-shadow:var(--shadow);}
  .card h2{font-family:'Fraunces',serif; font-size:20px; margin:0 0 14px;}
  label{display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin:14px 0 5px;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=number], input[type=date], textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line);
    font-family:'Karla',sans-serif; font-size:14.5px; box-sizing:border-box;
  }
  textarea{resize:vertical; min-height:60px;}
  .btn{font-family:'Karla',sans-serif; font-weight:700; font-size:14px; padding:10px 18px; border-radius:100px; border:none; cursor:pointer; background:var(--ink); color:#fff;}
  .btn.secondary{background:transparent; color:var(--ink); border:1.5px solid var(--ink);}
  .btn.small{font-size:12.5px; padding:6px 12px;}
  .btn:disabled{opacity:0.4; cursor:default;}
  .row{display:flex; gap:12px;}
  .row > div{flex:1;}
  .avatar-preview{display:flex; align-items:center; gap:14px; margin-top:10px;}
  .avatar-preview img{width:64px; height:64px; border-radius:50%; background:var(--bg); border:2px solid var(--line); image-rendering:pixelated;}
  canvas{display:none;}
  .recorrido-item{border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; background:#FBF9F3;}
  .recorrido-item h3{margin:0 0 4px; font-family:'Fraunces',serif; font-size:17px;}
  .recorrido-item .meta{font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;}
  .recorrido-item .link-box{display:flex; gap:8px; align-items:center; margin-bottom:10px;}
  .recorrido-item .link-box input{font-size:12px; padding:6px 8px;}
  .tag-activo{display:inline-block; background:var(--success-soft); color:#3E5324; font-size:11px; font-weight:700; padding:2px 8px; border-radius:100px;}
  .tag-archivado{display:inline-block; background:var(--line); color:var(--ink-soft); font-size:11px; font-weight:700; padding:2px 8px; border-radius:100px;}
  .participante-row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .participante-row:last-child{border-bottom:none;}
  .participante-row .bar{background:var(--line); border-radius:6px; height:6px; width:80px; overflow:hidden; margin-top:3px;}
  .participante-row .bar-fill{background:var(--success); height:100%;}
  .msg-box{display:flex; gap:8px; margin-top:8px;}
  .msg-box select, .msg-box input{flex:1;}
  #gate{max-width:340px; margin:80px auto;}
  #gate input{text-align:center; letter-spacing:0.1em;}
  #panelWrap{display:none;}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:100px; font-size:13.5px; opacity:0; transition:opacity .3s ease; pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="wrap">
  <div id="gate" class="card">
    <h2>Panel Admin 🔒</h2>
    <label>PIN</label>
    <input type="text" id="pinInput" placeholder="••••••">
    <button class="btn" style="width:100%; margin-top:14px;" id="pinBtn">Entrar</button>
    <div id="pinError" style="color:#A65136; font-size:13px; margin-top:8px;"></div>
  </div>

  <div id="panelWrap">
    <h1>Panel Admin</h1>
    <p class="sub">Michis en Casa — gestión de recorridos</p>

    <div class="card">
      <h2>Crear nuevo recorrido</h2>
      <label>Nombre del recorrido</label>
      <input type="text" id="fNombre" placeholder="Ej: Cuidado de Milo y Zoe — Octubre">
      <div class="row">
        <div>
          <label>Cantidad de días</label>
          <input type="number" id="fDias" value="3" min="1" max="14">
        </div>
        <div>
          <label>Fecha de inicio</label>
          <input type="date" id="fFecha">
        </div>
      </div>
      <label>Nombre del héroe/a</label>
      <input type="text" id="fHeroe" placeholder="Ej: Juan">
      <label>Foto para el avatar (se pixela sola)</label>
      <input type="file" accept="image/*" id="fFoto">
      <canvas id="canvasWork" width="240" height="240"></canvas>
      <div class="avatar-preview">
        <img id="avatarPreviewImg" src="" alt="preview">
        <span style="font-size:12.5px; color:var(--ink-soft);" id="avatarPreviewLabel">Sin foto — se usa un avatar genérico</span>
      </div>
      <label>Mensaje pop-up de bienvenida (opcional, lo ve cada persona una vez al entrar)</label>
      <textarea id="fPopup" placeholder="Ej: ¡Gracias por bancarnos estos días! Cualquier cosa nos escribís."></textarea>
      <button class="btn" style="margin-top:16px;" id="crearBtn">Crear recorrido</button>
      <div id="crearMsg" style="font-size:13.5px; margin-top:10px; color:var(--success);"></div>
    </div>

    <div class="card">
      <h2>Recorridos existentes</h2>
      <div id="recorridosList">Cargando...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ADMIN_PIN = "M1Zo3";

const firebaseConfig = {
  apiKey: "AIzaSyAi-tOBkoxFtBuw_Bgk6WCfX8wrQYxbrG4",
  authDomain: "michis-en-casa.firebaseapp.com",
  projectId: "michis-en-casa",
  storageBucket: "michis-en-casa.firebasestorage.app",
  messagingSenderId: "644207160311",
  appId: "1:644207160311:web:f63cdcf0a1025170891cf2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

document.getElementById("pinBtn").addEventListener("click", () => {
  const val = document.getElementById("pinInput").value;
  if(val === ADMIN_PIN){
    document.getElementById("gate").style.display = "none";
    document.getElementById("panelWrap").style.display = "block";
    document.getElementById("fFecha").value = new Date().toISOString().slice(0,10);
    cargarRecorridos();
  } else {
    document.getElementById("pinError").textContent = "PIN incorrecto.";
  }
});
document.getElementById("pinInput").addEventListener("keydown", (e) => {
  if(e.key === "Enter") document.getElementById("pinBtn").click();
});

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

// ===== Pixelado de foto en el navegador (canvas) =====
let avatarDataUrl = "";
document.getElementById("fFoto").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const img = new Image();
  img.onload = () => {
    const canvas = document.getElementById("canvasWork");
    const ctx = canvas.getContext("2d");
    // recorte cuadrado centrado
    const side = Math.min(img.width, img.height);
    const sx = (img.width - side)/2, sy = (img.height - side)/2;

    // paso 1: reducir a una grilla chica (pixelado)
    const small = document.createElement("canvas");
    small.width = 22; small.height = 22;
    const sctx = small.getContext("2d");
    sctx.imageSmoothingEnabled = true;
    sctx.drawImage(img, sx, sy, side, side, 0, 0, 22, 22);

    // paso 2: escalar para arriba sin suavizado -> efecto pixel art
    canvas.width = 240; canvas.height = 240;
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0,0,240,240);
    ctx.drawImage(small, 0, 0, 22, 22, 0, 0, 240, 240);

    // paso 3: recortar en círculo
    ctx.globalCompositeOperation = "destination-in";
    ctx.beginPath();
    ctx.arc(120,120,120,0,Math.PI*2);
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";

    avatarDataUrl = canvas.toDataURL("image/png");
    document.getElementById("avatarPreviewImg").src = avatarDataUrl;
    document.getElementById("avatarPreviewLabel").textContent = "Así se va a ver en el recorrido";
  };
  img.src = URL.createObjectURL(file);
});

// ===== Crear recorrido =====
document.getElementById("crearBtn").addEventListener("click", async () => {
  const nombre = document.getElementById("fNombre").value.trim();
  const dias = parseInt(document.getElementById("fDias").value) || 3;
  const fechaInicio = document.getElementById("fFecha").value;
  const heroeNombre = document.getElementById("fHeroe").value.trim();
  const popupGlobal = document.getElementById("fPopup").value.trim();

  if(!nombre){ toast("Ponele un nombre al recorrido"); return; }

  const btn = document.getElementById("crearBtn");
  btn.disabled = true; btn.textContent = "Creando...";
  try{
    const docRef = await db.collection("recorridos").add({
      nombre, dias, fechaInicio, heroeNombre,
      heroeAvatar: avatarDataUrl || "",
      popupGlobal: popupGlobal || "",
      activo: true,
      creado: Date.now()
    });
    const url = `${location.origin}${location.pathname.replace("admin.html","index.html")}?r=${docRef.id}`;
    document.getElementById("crearMsg").innerHTML = `Recorrido creado. Link: <a href="${url}" target="_blank">${url}</a>`;
    document.getElementById("fNombre").value = "";
    document.getElementById("fHeroe").value = "";
    document.getElementById("fPopup").value = "";
    avatarDataUrl = "";
    document.getElementById("avatarPreviewImg").src = "";
    document.getElementById("avatarPreviewLabel").textContent = "Sin foto — se usa un avatar genérico";
    cargarRecorridos();
  }catch(e){
    console.error(e);
    toast("Error al crear. Revisá la consola.");
  }
  btn.disabled = false; btn.textContent = "Crear recorrido";
});

// ===== Listado + monitoreo en vivo + mensajes =====
async function cargarRecorridos(){
  const listEl = document.getElementById("recorridosList");
  try{
    const snap = await db.collection("recorridos").orderBy("creado","desc").get();
    if(snap.empty){ listEl.innerHTML = "<p style='color:var(--ink-soft); font-size:14px;'>Todavía no creaste ningún recorrido.</p>"; return; }
    listEl.innerHTML = "";
    snap.forEach(doc => {
      const r = doc.data();
      const id = doc.id;
      const url = `${location.origin}${location.pathname.replace("admin.html","index.html")}?r=${id}`;
      const item = document.createElement("div");
      item.className = "recorrido-item";
      item.innerHTML = `
        <h3>${r.nombre || "(sin nombre)"} <span class="${r.activo ? 'tag-activo' : 'tag-archivado'}">${r.activo ? 'activo' : 'archivado'}</span></h3>
        <div class="meta">${r.dias} días · desde ${r.fechaInicio || "?"} · héroe: ${r.heroeNombre || "—"}</div>
        <div class="link-box">
          <input type="text" readonly value="${url}">
          <button class="btn small secondary" onclick="navigator.clipboard.writeText('${url}'); toast('Link copiado')">Copiar</button>
          <button class="btn small secondary" onclick="toggleActivo('${id}', ${!r.activo})">${r.activo ? 'Archivar' : 'Reactivar'}</button>
        </div>
        <div class="participantes-box" id="parts-${id}">Cargando participantes...</div>
        <div class="msg-box">
          <select id="sel-${id}"><option value="">Elegir persona...</option></select>
          <input type="text" id="msg-${id}" placeholder="Mensaje puntual...">
          <button class="btn small" onclick="enviarMensaje('${id}')">Enviar</button>
        </div>
      `;
      listEl.appendChild(item);
      escucharParticipantes(id);
    });
  }catch(e){
    console.error(e);
    listEl.innerHTML = "<p style='color:#A65136;'>Error cargando recorridos.</p>";
  }
}

function escucharParticipantes(recorridoId){
  db.collection("recorridos").doc(recorridoId).collection("participantes")
    .onSnapshot(snap => {
      const box = document.getElementById("parts-"+recorridoId);
      const sel = document.getElementById("sel-"+recorridoId);
      if(!box) return;
      if(snap.empty){ box.innerHTML = "<p style='font-size:12.5px; color:var(--ink-soft);'>Nadie entró todavía.</p>"; return; }
      box.innerHTML = "";
      sel.innerHTML = '<option value="">Elegir persona...</option>';
      snap.forEach(doc => {
        const p = doc.data();
        const st = p.state || {};
        let total = 0, done = 0;
        Object.keys(st).forEach(dia => {
          Object.keys(st[dia]).forEach(k => { total++; if(st[dia][k]) done++; });
        });
        const pct = total ? Math.round(done/total*100) : 0;
        const row = document.createElement("div");
        row.className = "participante-row";
        row.innerHTML = `
          <div>
            <div>${p.nombre}</div>
            <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
          </div>
          <div style="color:var(--ink-soft); font-size:12px;">${done}/${total}</div>
        `;
        box.appendChild(row);
        const opt = document.createElement("option");
        opt.value = doc.id; opt.textContent = p.nombre;
        sel.appendChild(opt);
      });
    });
}

async function toggleActivo(id, nuevoValor){
  await db.collection("recorridos").doc(id).set({ activo: nuevoValor }, { merge: true });
  toast(nuevoValor ? "Recorrido reactivado" : "Recorrido archivado");
  cargarRecorridos();
}

async function enviarMensaje(recorridoId){
  const sel = document.getElementById("sel-"+recorridoId);
  const input = document.getElementById("msg-"+recorridoId);
  const participanteId = sel.value;
  const mensaje = input.value.trim();
  if(!participanteId || !mensaje){ toast("Elegí a alguien y escribí el mensaje"); return; }
  await db.collection("recorridos").doc(recorridoId).collection("participantes").doc(participanteId)
    .set({ popupPersonal: { mensaje, leido: false } }, { merge: true });
  input.value = "";
  toast("Mensaje enviado — lo va a ver la próxima vez que entre");
}
</script>
</body>
</html>
