<style>
  :root{
    --bg:#F2EEE1; --surface:#FFFFFF; --ink:#2B2620; --ink-soft:#655D4F;
    --mustard:#C79A2E; --teal:#355F58; --teal-soft:#DCE7E3; --clay:#A65136; --clay-soft:#F0DCD2;
    --success:#5E7A3D; --success-soft:#E1E9D3; --orange:#DD8A3D; --orange-soft:#FBE7D2;
    --line:#DED2B4; --shadow:0 2px 0 rgba(43,38,32,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Karla',sans-serif; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px; margin:0 auto; padding:14px 16px 60px;}
  button{font-family:inherit; cursor:pointer;}

  .topbar{display:flex; align-items:center; gap:12px; font-size:12.5px; color:var(--ink-soft); min-height:36px; margin-bottom:18px;}
  .topbar a{color:var(--ink); font-weight:700; text-decoration:none; font-size:13px;}
  .topbar .der{margin-left:auto; display:flex; gap:12px; align-items:center;}
  .marca-mini{display:flex; align-items:center; gap:7px; font-family:'Fraunces',serif; font-size:15px !important;}
  .marca-mini .caras{width:36px; height:17px;}
  .caras{width:46px; height:22px; flex:none; overflow:visible;}
  .eyebrow{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--teal); margin-bottom:3px;}
  html.dark .eyebrow{color:#72AEA3;}
  h1{font-family:'Fraunces',serif; font-weight:700; font-size:25px; line-height:1.1; margin:0; letter-spacing:-.01em;}
  .intro{font-size:14.5px; line-height:1.5; color:var(--ink-soft); margin:10px 0 18px;}
  .intro b{color:var(--ink);}

  .seccion{font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin:26px 2px 4px;}
  .seccion-intro{font-size:13.5px; color:var(--ink-soft); margin:0 2px 10px; line-height:1.45;}
  .preg{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 14px 12px; margin-bottom:10px; box-shadow:var(--shadow);}
  .preg .q{font-weight:700; font-size:15.5px; line-height:1.35; margin:0 0 3px;}
  .preg .ay{font-size:12.5px; color:var(--ink-soft); margin:0 0 10px;}
  .preg .q + .ops, .preg .q + .escala, .preg .q + .nps, .preg .q + textarea{margin-top:10px;}
  .ops{display:flex; flex-wrap:wrap; gap:7px;}
  .op{border:1.5px solid var(--line); background:#FBF9F3; color:var(--ink); border-radius:100px; padding:8px 13px; font-size:14px; font-weight:600; text-align:left; line-height:1.25;}
  .op.on{border-color:var(--teal); background:var(--teal-soft); box-shadow:0 0 0 1.5px var(--teal); color:var(--teal);}
  html.dark .op{background:var(--surface-2);}
  html.dark .op.on{background:#1E302C; color:#9CD1C6; border-color:#72AEA3; box-shadow:0 0 0 1.5px #72AEA3;}
  .escala{display:grid; grid-template-columns:repeat(5,1fr); gap:6px;}
  .escala .op{text-align:center; padding:8px 2px 6px; border-radius:14px; display:flex; flex-direction:column; align-items:center; gap:2px;}
  .escala .op span{font-size:24px; line-height:1.1;}
  .escala .op small{font-size:11px; font-weight:700; color:var(--ink-soft);}
  .nps{display:grid; grid-template-columns:repeat(11,1fr); gap:3px;}
  .nps .op{padding:9px 0; text-align:center; border-radius:10px; font-size:14px;}
  .nps-ext{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-soft); margin-top:5px;}
  .campo{width:100%; font-family:inherit; font-size:15px; border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; background:#fff; color:var(--ink);}
  textarea.campo{resize:vertical; min-height:74px;}
  .codigo-input{letter-spacing:.3em; font-size:18px; text-align:center; margin-bottom:6px;}
  .codigo-input::placeholder{letter-spacing:normal; font-size:15px;}

  .enviar-box{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; margin-top:22px; box-shadow:var(--shadow);}
  .check{display:flex; gap:10px; align-items:flex-start; font-size:14px; line-height:1.4; cursor:pointer;}
  .check input{width:19px; height:19px; margin:1px 0 0; flex:none; accent-color:var(--teal);}
  .check small{display:block; color:var(--ink-soft); font-size:12.5px; margin-top:2px;}
  .acciones{display:flex; gap:8px; margin-top:14px;}
  .acciones button, .acciones a{flex:1; border-radius:100px; padding:12px; font-size:15px; font-weight:700; border:none; background:var(--ink); color:#fff; text-align:center; text-decoration:none;}
  .acciones .sec{background:transparent; color:var(--ink); border:1.5px solid var(--ink);}
  .acciones button:disabled{opacity:.4; cursor:default;}
  html.dark .acciones button:not(.sec), html.dark .acciones a:not(.sec){color:#1B1814;}
  .aviso{background:var(--clay-soft); color:var(--clay); border-radius:12px; padding:9px 12px; font-size:13.5px; font-weight:700; margin:12px 0 0;}
  html.dark .aviso{color:#E38F74;}
  .nota{font-size:12.5px; color:var(--ink-soft); line-height:1.45; margin:10px 2px 0;}

  .mensaje{text-align:center; padding:50px 10px; color:var(--ink-soft);}
  .mensaje h1{margin-bottom:10px;}
  .mensaje p{line-height:1.5;}
  .mensaje .grande{font-size:46px; margin-bottom:8px;}
  .gate{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px 18px; margin-top:10px; text-align:center; box-shadow:var(--shadow);}
  .gate h1{margin-bottom:10px;}
  .gate p{font-size:14px; color:var(--ink-soft); line-height:1.5; margin:0 0 14px;}
  .gate .codigo-input{margin-bottom:10px;}
  .gate .gate-pie{font-size:13px; margin:18px 0 0;}
  .gate .gate-pie button{background:none; border:none; padding:0; font-size:13px; color:var(--ink-soft); text-decoration:underline;}
  .o-google{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:12px; background:none; border:1.5px solid var(--line); border-radius:100px; padding:9px; font-size:13.5px; font-weight:700; color:var(--ink);}
  .o-google svg{width:16px; height:16px;}

  /* Resultados (admin) */
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow);}
  .panel h2{font-family:'Fraunces',serif; font-weight:600; font-size:18px; margin:0 0 8px;}
  .estado{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .estado .tag{font-size:12px; font-weight:700; border-radius:100px; padding:3px 10px;}
  .tag.abierta{background:var(--success-soft); color:var(--success);}
  .tag.cerrada{background:var(--clay-soft); color:var(--clay);}
  html.dark .tag.abierta{color:#A9C77F;}
  html.dark .tag.cerrada{color:#E38F74;}
  .btn-sm{border:none; border-radius:100px; padding:7px 13px; font-size:13px; font-weight:700; background:var(--ink); color:#fff; text-decoration:none; display:inline-block;}
  .btn-sm.sec{background:transparent; color:var(--ink); border:1.5px solid var(--line); padding:5px 11px; font-size:12.5px;}
  html.dark .btn-sm:not(.sec){color:#1B1814;}
  .botones{display:flex; gap:7px; flex-wrap:wrap; margin-top:10px;}
  .quienes{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;}
  .quienes span{font-size:13px; font-weight:700; border-radius:100px; padding:4px 10px; background:var(--orange-soft); color:#9A5A1E;}
  .quienes span.ok{background:var(--success-soft); color:var(--success);}
  html.dark .quienes span{color:#E89B52;}
  html.dark .quienes span.ok{color:#A9C77F;}
  .res{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:13px 14px; margin-bottom:10px; box-shadow:var(--shadow);}
  .res .q{font-weight:700; font-size:14.5px; margin:0 0 9px; line-height:1.35;}
  .res .q small{font-weight:500; color:var(--ink-soft);}
  .res .ay{font-size:12px; color:var(--ink-soft); margin:-5px 0 9px;}
  .fila-res{display:grid; grid-template-columns:minmax(0,1fr) 90px 26px; align-items:center; gap:8px; font-size:13px; margin-bottom:5px;}
  .fila-res .et{overflow:hidden; text-overflow:ellipsis;}
  .fila-res .b{height:9px; border-radius:5px; background:var(--bg); overflow:hidden;}
  .fila-res .b i{display:block; height:100%; background:var(--teal); border-radius:5px;}
  html.dark .fila-res .b i{background:#72AEA3;}
  .fila-res .n{text-align:right; font-weight:700;}
  .grande-num{font-family:'Fraunces',serif; font-size:30px; font-weight:700; line-height:1;}
  .grande-num small{font-family:'Karla',sans-serif; font-size:13px; font-weight:500; color:var(--ink-soft);}
  .textos{display:flex; flex-direction:column; gap:7px;}
  .textos div{background:var(--bg); border-radius:10px; padding:8px 10px; font-size:13.5px; line-height:1.4; white-space:pre-wrap; overflow-wrap:anywhere;}
  .textos div b{display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:2px;}
  .vacio{font-size:13.5px; color:var(--ink-soft);}
  .tabs{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:100px; padding:2px; margin:6px 0 14px;}
  .tabs button{flex:1; border:none; background:none; font-size:13px; font-weight:700; color:var(--ink-soft); padding:7px 10px; border-radius:100px;}
  .tabs button.on{background:var(--ink); color:#fff;}
  html.dark .tabs button.on{color:#1B1814;}
  .resp{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:10px; box-shadow:var(--shadow); font-size:13.5px;}
  .resp h3{font-size:14px; margin:0 0 8px;}
  .resp dl{margin:0;}
  .resp dt{font-size:12px; color:var(--ink-soft); margin-top:7px;}
  .resp dd{margin:1px 0 0; white-space:pre-wrap; overflow-wrap:anywhere;}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:100px; font-size:13.5px; opacity:0; transition:opacity .3s ease; pointer-events:none; z-index:60; max-width:90vw; text-align:center;}
  .toast.show{opacity:1;}
  html.dark .toast{color:#1B1814;}
</style>

    ops:["Grupo de WhatsApp", "Una sola persona de confianza", "Le pagamos a un cuidador o paseador", "Guardería u hotel de mascotas", "Se las llevan", "No tengo mascotas ni conozco el caso"] },
  { k:"otrosUsos", tipo:"varias", q:"¿Para qué más usarías algo como Les Gates?", ayuda:"Marcá todas las que quieras",
    ops:["Perros", "Otras mascotas", "Regar plantas o cuidar la casa", "Turnos para cuidar a una persona (mayor, chicos)", "Organizar otras cosas entre amigos o familia", "Para nada más"] },
  { k:"nps", tipo:"nps", q:"Del 0 al 10, ¿qué tan probable es que le recomiendes Les Gates a alguien que viaja y deja mascotas?" },
  { k:"modelo", tipo:"una", q:"Si tuvieras mascotas y te fueras de viaje, ¿qué preferirías?",
    ops:["Una app gratis para organizar a mi gente", "Pagar un poco por la app, con más funciones", "Que Les Gates me consiga cuidadores pagos de confianza", "Ninguna: me arreglo como siempre"] },
  { k:"pagarias", tipo:"una", q:"¿Cuánto pagarías por usar la app en un viaje de unos 10 días?", ayuda:"Para organizar a tu propia gente, sin cuidadores pagos",
    ops:["Nada", "Lo que sale un café", "Lo que sale una comida afuera", "Más que eso"] },
  { k:"cuidarPago", tipo:"una", q:"¿Te interesaría cuidar mascotas de otras personas, cobrando, a través de la app?",
    ops:["Sí", "Tal vez", "No"] },

  { seccion:"Para terminar" },
  { k:"extra", tipo:"texto", q:"¿Algo más que nos quieras contar?", ph:"Ideas, quejas, anécdotas de Milo y Zoe…" },
];
const PREGS = PREGUNTAS.filter(p => p.k);
const MAX_TEXTO = 1000;

const recorridoId = new URLSearchParams(location.search).get("r");
const verFormulario = new URLSearchParams(location.search).get("ver") === "form";   // el admin mira cómo la ven
let usuario = null;
let recorrido = null;
let miPid = null;
let respuestas = {};
let entrandoConCodigo = false;

function recorridoRef(){ return db.collection("recorridos").doc(recorridoId); }
function soyAdmin(){ return esAdmin(usuario); }
function linkEncuesta(){ return `${location.origin}${location.pathname}?r=${encodeURIComponent(recorridoId)}`; }
function mensajeWhatsApp(){
  return `¡Hola! 🐾 Gracias por cuidar a Milo y Zoe. ¿Nos contás cómo te fue con la app? Son unos 5 minutos y nos ayuda un montón a mejorarla: ${linkEncuesta()}`;
}
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 3200);
}
function topbar(){
  return `<div class="topbar"><a href="index.html" class="marca-mini" title="Les Gates: inicio">${CARAS}<span>Les Gates</span></a><span class="der">${botonTema()}</span></div>`;
}
function mensaje(titulo, texto, emoji){
  document.getElementById("app").innerHTML = `${topbar()}
    <div class="mensaje">${emoji ? `<div class="grande">${emoji}</div>` : ""}<h1>${escapeHtml(titulo)}</h1><p>${escapeHtml(texto)}</p>
    <div class="acciones" style="max-width:260px; margin:22px auto 0;"><a class="sec" href="index.html">Ir al inicio</a></div></div>`;
}

// ===== Entrada: como en turnos, con el código de 6 números (cada celular queda recordado) =====
function init(){
  if(!recorridoId){ mensaje("Falta el recorrido", "Este link está incompleto. Pedile el link de la encuesta a quien te invitó."); return; }
  auth.onAuthStateChanged(async user => {
    if(entrandoConCodigo) return;
    usuario = user;
    await resolverEntrada();
  });
}

async function resolverEntrada(){
  miPid = usuario ? await membresia(recorridoId) : null;
  if(!miPid && !soyAdmin()){ gate(); return; }
  try{
    const snap = await recorridoRef().get();
    if(!snap.exists){ mensaje("No encontrado", "Este recorrido ya no existe o el link está mal."); return; }
    recorrido = snap.data();
  }catch(e){
    console.warn(e);
    mensaje("Todavía no está lista", "Este recorrido todavía no está publicado.");
    return;
  }
  if(soyAdmin() && !verFormulario){ resultados(); return; }
  if(soyAdmin()){ formulario(); return; }
  if(!recorrido.encuesta){ mensaje("La encuesta todavía no está abierta", "Cuando esté lista te avisamos. ¡Gracias por cuidar a Milo y Zoe!", "🐾"); return; }
  try{
    const hecha = await recorridoRef().collection("encuestaHecha").doc(miPid).get();
    if(hecha.exists){ gracias(true); return; }
  }catch(e){ console.warn(e); }
  formulario();
}

function gate(){
  document.getElementById("app").innerHTML = `${topbar()}
    <div class="gate">
      <h1>¿Cómo te fue cuidando a Milo y Zoe?</h1>
      <p>${usuario && !esAnonimo(usuario)
        ? "Tu cuenta de Google todavía no está vinculada a este recorrido. Poné tu código una vez y queda vinculada."
        : "Para responder la encuesta, entrá con el código de 6 números que te pasaron por WhatsApp (el mismo de los turnos)."}</p>
      <input class="campo codigo-input" id="gCodigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Tu código de 6 números">
      <div class="acciones"><button id="gEntrar">Entrar</button></div>
      <div class="aviso" id="gError" style="display:none;"></div>
      ${usuario ? `<p class="gate-pie">${esAnonimo(usuario) ? "Entraste con un código de otro recorrido" : "Conectado como " + escapeHtml(usuario.email || "")} · <button data-salir>Salir</button></p>`
        : `<p class="gate-pie">¿Ya entraste antes con tu cuenta de Google?</p><button class="o-google" id="gGoogle">${GOOGLE_SVG} Entrar con Google</button>`}
    </div>`;
  const input = document.getElementById("gCodigo");
  setTimeout(() => input.focus(), 50);
  const entrar = async () => {
    const btn = document.getElementById("gEntrar"), err = document.getElementById("gError");
    btn.disabled = true; err.style.display = "none";
    entrandoConCodigo = true;
    try{
      const { rid } = await entrarConCodigo(input.value);
      usuario = auth.currentUser;
      entrandoConCodigo = false;
      if(rid !== recorridoId){ location.href = `encuesta.html?r=${encodeURIComponent(rid)}`; return; }
      await resolverEntrada();
    }catch(e){
      console.warn(e);
      entrandoConCodigo = false;
      usuario = auth.currentUser;
      err.textContent = mensajeErrorCodigo(e); err.style.display = "block";
      btn.disabled = false;
    }
  };
  document.getElementById("gEntrar").addEventListener("click", entrar);
  input.addEventListener("keydown", e => { if(e.key === "Enter") entrar(); });
  const g = document.getElementById("gGoogle");
  if(g) g.addEventListener("click", loginGoogle);
  document.querySelectorAll("#app [data-salir]").forEach(b => b.addEventListener("click", () => auth.signOut()));
}

// ===== Formulario =====
function preguntaHTML(p){
  const v = respuestas[p.k];
  const ay = p.ayuda ? `<p class="ay">${escapeHtml(p.ayuda)}</p>` : "";
  let cuerpo = "";
  if(p.tipo === "escala"){
    cuerpo = `<div class="escala">${p.ops.map(([emoji, et], i) =>
      `<button type="button" class="op${v === i + 1 ? " on" : ""}" data-k="${p.k}" data-v="${i + 1}" aria-pressed="${v === i + 1}"><span>${emoji}</span><small>${escapeHtml(et)}</small></button>`).join("")}</div>`;
  } else if(p.tipo === "nps"){
    cuerpo = `<div class="nps">${Array.from({ length: 11 }, (_, i) =>
      `<button type="button" class="op${v === i ? " on" : ""}" data-k="${p.k}" data-v="${i}" aria-pressed="${v === i}">${i}</button>`).join("")}</div>
      <div class="nps-ext"><span>Nada probable</span><span>Muy probable</span></div>`;
  } else if(p.tipo === "una" || p.tipo === "varias"){
    const on = o => p.tipo === "una" ? v === o : (v || []).includes(o);
    cuerpo = `<div class="ops">${p.ops.map((o, i) =>
      `<button type="button" class="op${on(o) ? " on" : ""}" data-k="${p.k}" data-i="${i}" aria-pressed="${on(o)}">${escapeHtml(o)}</button>`).join("")}</div>`;
  } else if(p.tipo === "texto"){
    cuerpo = `<textarea class="campo" data-k="${p.k}" maxlength="${MAX_TEXTO}" placeholder="${escapeHtml(p.ph || "Opcional")}">${escapeHtml(v || "")}</textarea>`;
  }
  return `<div class="preg" data-preg="${p.k}"><p class="q">${escapeHtml(p.q)}</p>${ay}${cuerpo}</div>`;
}

function formulario(){
  const previa = soyAdmin();
  document.getElementById("app").innerHTML = `${topbar()}
    ${previa ? `<p class="aviso" style="margin:0 0 14px;">Vista previa: así la ven tus cuidadores. Desde acá no se envía. <a href="encuesta.html?r=${encodeURIComponent(recorridoId)}">Ver resultados</a></p>` : ""}
    <div class="eyebrow">Encuesta · ${escapeHtml(recorrido.nombre || "Les Gates")}</div>
    <h1>¿Cómo te fue cuidando a Milo y Zoe?</h1>
    <p class="intro">Gracias por darles de comer 🐾 Nos ayudás mucho contándonos cómo te fue con la app: queremos mejorarla y, quizás, que la puedan usar otras personas. <b>Son unos 5 minutos y todo es opcional.</b></p>
    ${PREGUNTAS.map(p => p.seccion
      ? `<h2 class="seccion">${escapeHtml(p.seccion)}</h2>${p.intro ? `<p class="seccion-intro">${escapeHtml(p.intro)}</p>` : ""}`
      : preguntaHTML(p)).join("")}
    <div class="enviar-box">
      <label class="check"><input type="checkbox" id="conNombre"><span>Mostrar mi nombre con mis respuestas<small>Si no lo marcás, se guardan sin tu nombre: se sabe que respondiste, pero no qué.</small></span></label>
      <div class="acciones"><button id="enviar"${previa ? " disabled" : ""}>Enviar</button></div>
      <div class="aviso" id="error" style="display:none;"></div>
      <p class="nota">Una vez enviada no se puede cambiar.</p>
    </div>`;
  const app = document.getElementById("app");
  app.querySelectorAll(".op[data-k]").forEach(b => b.addEventListener("click", () => elegir(b)));
  app.querySelectorAll("textarea[data-k]").forEach(t => t.addEventListener("input", () => {
    const val = t.value.slice(0, MAX_TEXTO);
    if(val.trim()) respuestas[t.dataset.k] = val; else delete respuestas[t.dataset.k];
  }));
  document.getElementById("enviar").addEventListener("click", enviar);
}

function elegir(b){
  const p = PREGS.find(x => x.k === b.dataset.k);
  if(p.tipo === "escala" || p.tipo === "nps"){
    const v = Number(b.dataset.v);
    if(respuestas[p.k] === v) delete respuestas[p.k]; else respuestas[p.k] = v;
  } else if(p.tipo === "una"){
    const o = p.ops[Number(b.dataset.i)];
    if(respuestas[p.k] === o) delete respuestas[p.k]; else respuestas[p.k] = o;
  } else {
    const o = p.ops[Number(b.dataset.i)];
    const lista = respuestas[p.k] || [];
    if(lista.includes(o)) respuestas[p.k] = lista.filter(x => x !== o);
    else if(p.max && lista.length >= p.max){ toast(`Elegí hasta ${p.max}: sacá una para cambiarla`); return; }
    else respuestas[p.k] = [...lista, o];
    if(!respuestas[p.k].length) delete respuestas[p.k];
  }
  // Redibuja solo esa pregunta
  const viejo = document.querySelector(`[data-preg="${p.k}"]`);
  viejo.outerHTML = preguntaHTML(p);
  document.querySelectorAll(`[data-preg="${p.k}"] .op`).forEach(x => x.addEventListener("click", () => elegir(x)));
}

async function enviar(){
  const btn = document.getElementById("enviar"), err = document.getElementById("error");
  err.style.display = "none";
  const r = {};
  PREGS.forEach(p => {
    const v = respuestas[p.k];
    if(v === undefined) return;
    r[p.k] = p.tipo === "texto" ? v.trim().slice(0, MAX_TEXTO) : v;
    if(r[p.k] === "") delete r[p.k];
  });
  if(Object.keys(r).length === 0){ err.textContent = "Respondé al menos una pregunta."; err.style.display = "block"; return; }
  btn.disabled = true; btn.textContent = "Enviando…";
  try{
    const doc = { r, v: 1 };
    if(document.getElementById("conNombre").checked){
      const p = await recorridoRef().collection("participantes").doc(miPid).get();
      if(p.exists && p.data().nombre) doc.nombre = p.data().nombre;
    }
    // En el mismo lote: la marca de "ya respondí" (con mi nombre) y las respuestas (con un id al azar)
    const lote = db.batch();
    lote.set(recorridoRef().collection("encuestaHecha").doc(miPid), { listo: true });
    lote.set(recorridoRef().collection("encuestas").doc(), doc);
    await lote.commit();
    gracias(false);
    window.scrollTo(0, 0);
  }catch(e){
    console.error(e);
    err.textContent = e.code === "permission-denied"
      ? "No se pudo enviar: puede que ya la hayas respondido o que la encuesta esté cerrada."
      : "No se pudo enviar. Revisá la conexión y probá de nuevo.";
    err.style.display = "block";
    btn.disabled = false; btn.textContent = "Enviar";
  }
}

function gracias(yaEstaba){
  mensaje(yaEstaba ? "Ya respondiste la encuesta" : "¡Gracias!",
    yaEstaba ? "Gracias por contarnos cómo te fue. Milo y Zoe te mandan un cabezazo." : "Tus respuestas nos ayudan un montón. Milo y Zoe te mandan un cabezazo.", "😻");
}

// ===== Resultados (solo el admin) =====
let vistaRes = "resumen";
let datos = null;   // { participantes, hechas:Set, respuestas:[] }

async function resultados(){
  document.getElementById("app").innerHTML = `${topbar()}<div class="mensaje">Cargando respuestas...</div>`;
  try{
    const [parts, hechas, resp] = await Promise.all([
      recorridoRef().collection("participantes").get(),
      recorridoRef().collection("encuestaHecha").get(),
      recorridoRef().collection("encuestas").get()
    ]);
    const participantes = {};
    parts.forEach(d => participantes[d.id] = d.data());
    // Mezcladas: el orden en que llegan no dice quién es quién
    const respuestas = resp.docs.map(d => d.data()).sort(() => Math.random() - 0.5);
    datos = { participantes, hechas: new Set(hechas.docs.map(d => d.id)), respuestas };
    renderResultados();
  }catch(e){
    console.error(e);
    mensaje("No se pudieron cargar las respuestas", "Revisá la conexión y que las reglas de Firestore estén publicadas.");
  }
}

function contar(p, lista){
  const c = new Map();
  if(p.tipo === "escala") p.ops.forEach(([e, et], i) => c.set(`${e} ${et}`, 0));
  else p.ops.forEach(o => c.set(o, 0));
  lista.forEach(r => {
    const v = r.r[p.k];
    if(v === undefined) return;
    const vals = p.tipo === "varias" ? v : [p.tipo === "escala" ? `${p.ops[v - 1][0]} ${p.ops[v - 1][1]}` : v];
    vals.forEach(x => c.set(x, (c.get(x) || 0) + 1));
  });
  return c;
}

function resumenHTML(p, lista){
  const conResp = lista.filter(r => r.r[p.k] !== undefined);
  const n = conResp.length;
  const cab = `<p class="q">${escapeHtml(p.q)} <small>· ${n} ${n === 1 ? "respuesta" : "respuestas"}</small></p>`;
  if(!n) return `<div class="res">${cab}<p class="vacio">Sin respuestas todavía.</p></div>`;
  if(p.tipo === "texto"){
    return `<div class="res">${cab}<div class="textos">${conResp.map(r =>
      `<div>${r.nombre ? `<b>${escapeHtml(r.nombre)}</b>` : ""}${escapeHtml(r.r[p.k])}</div>`).join("")}</div></div>`;
  }
  let extra = "";
  if(p.tipo === "escala"){
    const prom = conResp.reduce((s, r) => s + r.r[p.k], 0) / n;
    extra = `<p class="grande-num">${prom.toFixed(1).replace(".", ",")} <small>de 5 en promedio</small></p>`;
  }
  if(p.tipo === "nps"){
    // NPS: % de 9-10 (promotores) menos % de 0-6 (detractores). Va de -100 a 100.
    const prom = conResp.filter(r => r.r[p.k] >= 9).length, det = conResp.filter(r => r.r[p.k] <= 6).length;
    const nps = Math.round((prom - det) / n * 100);
    const prome = conResp.reduce((s, r) => s + r.r[p.k], 0) / n;
    const filas = [["9–10 (te recomiendan)", prom], ["7–8 (neutrales)", n - prom - det], ["0–6 (no te recomiendan)", det]];
    return `<div class="res">${cab}<p class="grande-num">NPS ${nps > 0 ? "+" : ""}${nps} <small>· promedio ${prome.toFixed(1).replace(".", ",")} de 10</small></p>
      <div style="margin-top:10px;">${filas.map(([et, c]) => filaRes(et, c, n)).join("")}</div></div>`;
  }
  const c = contar(p, lista);
  const ay = p.tipo === "varias" ? `<p class="ay">Podían elegir más de una</p>` : "";
  return `<div class="res">${cab}${ay}${extra}<div style="margin-top:${extra ? 10 : 0}px;">${[...c.entries()].map(([et, cant]) => filaRes(et, cant, n)).join("")}</div></div>`;
}
function filaRes(et, cant, n){
  const pct = n ? Math.round(cant / n * 100) : 0;
  return `<div class="fila-res"><span class="et">${escapeHtml(et)}</span><span class="b"><i style="width:${pct}%"></i></span><span class="n">${cant}</span></div>`;
}

function respuestaHTML(r, i){
  const filas = PREGS.filter(p => r.r[p.k] !== undefined).map(p => {
    let v = r.r[p.k];
    if(p.tipo === "escala") v = `${p.ops[v - 1][0]} ${p.ops[v - 1][1]}`;
    if(p.tipo === "varias") v = v.join(" · ");
    return `<dt>${escapeHtml(p.q)}</dt><dd>${escapeHtml(v)}</dd>`;
  }).join("");
  return `<div class="resp"><h3>${r.nombre ? escapeHtml(r.nombre) : `Respuesta ${i + 1} · sin nombre`}</h3><dl>${filas}</dl></div>`;
}

function renderResultados(){
  const { participantes, hechas, respuestas: lista } = datos;
  const pids = Object.keys(participantes).sort((a, b) => (participantes[a].nombre || "").localeCompare(participantes[b].nombre || ""));
  const abierta = !!recorrido.encuesta;
  document.getElementById("app").innerHTML = `${topbar()}
    <div class="eyebrow">Encuesta · ${escapeHtml(recorrido.nombre || "")}</div>
    <h1 style="margin-bottom:14px;">Resultados</h1>
    <div class="panel">
      <div class="estado"><span class="tag ${abierta ? "abierta" : "cerrada"}">${abierta ? "Abierta" : "Cerrada"}</span>
        <span style="font-size:13.5px; color:var(--ink-soft);">${abierta ? "Les aparece en la home a quienes no respondieron." : "Nadie puede responder hasta que la abras."}</span></div>
      <div class="botones">
        <button class="btn-sm" id="toggle">${abierta ? "Cerrar encuesta" : "Abrir encuesta"}</button>
        <button class="btn-sm sec" id="copiar">Copiar mensaje</button>
        <a class="btn-sm sec" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(mensajeWhatsApp())}">WhatsApp</a>
        <a class="btn-sm sec" href="encuesta.html?r=${encodeURIComponent(recorridoId)}&ver=form">Ver el formulario</a>
        <button class="btn-sm sec" id="csv"${lista.length ? "" : " disabled"}>Descargar CSV</button>
      </div>
    </div>
    <div class="panel">
      <h2>Respondieron ${hechas.size} de ${pids.length}</h2>
      <div class="quienes">${pids.map(pid => `<span class="${hechas.has(pid) ? "ok" : ""}">${hechas.has(pid) ? "✓ " : ""}${escapeHtml(participantes[pid].nombre || pid)}</span>`).join("")}</div>
      <p class="nota" style="margin:10px 0 0;">Se ve quién respondió, pero no qué, salvo quien eligió mostrar su nombre (${lista.filter(r => r.nombre).length} de ${lista.length}).</p>
    </div>
    ${lista.length ? `<div class="tabs"><button data-vista="resumen" class="${vistaRes === "resumen" ? "on" : ""}">Resumen</button><button data-vista="una" class="${vistaRes === "una" ? "on" : ""}">Una por una</button></div>` : ""}
    ${!lista.length ? `<p class="vacio" style="text-align:center; padding:20px;">Todavía no hay respuestas.</p>`
      : vistaRes === "resumen"
        ? PREGUNTAS.map(p => p.seccion ? `<h2 class="seccion">${escapeHtml(p.seccion)}</h2>` : resumenHTML(p, lista)).join("")
        : lista.map(respuestaHTML).join("")}`;
  document.getElementById("toggle").addEventListener("click", async () => {
    const nueva = !recorrido.encuesta;
    if(nueva && !confirm("¿Abrir la encuesta? A quienes no respondieron les va a aparecer en la home.")) return;
    try{
      await recorridoRef().update({ encuesta: nueva });
      recorrido.encuesta = nueva;
      toast(nueva ? "Encuesta abierta" : "Encuesta cerrada");
      renderResultados();
    }catch(e){ console.error(e); toast("No se pudo cambiar. Revisá la consola."); }
  });
  document.getElementById("copiar").addEventListener("click", async () => {
    try{ await navigator.clipboard.writeText(mensajeWhatsApp()); toast("Mensaje copiado: pegalo en WhatsApp"); }
    catch(e){ prompt("Copiá este mensaje:", mensajeWhatsApp()); }
  });
  document.getElementById("csv").addEventListener("click", descargarCSV);
  document.querySelectorAll("[data-vista]").forEach(b => b.addEventListener("click", () => { vistaRes = b.dataset.vista; renderResultados(); }));
}

function descargarCSV(){
  const celda = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const cab = ["Nombre", ...PREGS.map(p => p.q)];
  const filas = datos.respuestas.map(r => [r.nombre || "", ...PREGS.map(p => {
    const v = r.r[p.k];
    if(v === undefined) return "";
    if(p.tipo === "escala") return v;
    if(p.tipo === "varias") return v.join(" | ");
    return v;
  })]);
  const csv = "﻿" + [cab, ...filas].map(f => f.map(celda).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `encuesta-${slugify(recorrido.nombre || "les-gates")}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

init();
</script>
